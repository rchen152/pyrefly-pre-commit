repos:
  - repo: https://github.com/rchen152/pyrefly-pre-commit
    rev: feat
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking)
        pass_filenames: false
        additional_dependencies:
          - pyrefly==0.43.1
          - requests==2.32.4
          - types-requests==2.32.4.20250913
